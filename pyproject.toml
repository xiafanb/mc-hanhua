[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-hanhua"
version = "0.1.0"
description = "Local Minecraft Java modpack, map, and mod translation tool."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mc-hanhua contributors" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
gui = ["PySide6>=6.7,<6.9"]
packaging = ["pyinstaller>=6.0.0"]
dev = ["pytest>=8.0.0", "PySide6>=6.7,<6.9"]

[project.scripts]
mc-hanhua = "mc_hanhua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Correctness (E/F), import order (I), and modern-syntax (UP) only; style
# families (SIM/BLE/DTZ/...) stay off to avoid churn in established code.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# StrEnum changes str(RiskLevel.X) semantics; the str+Enum mixin is deliberate.
ignore = ["UP042"]
